server.port=${AUTH_SERVER_PORT:2051}
spring.application.name=auth-service
spring.config.import=optional:configserver:http://localhost:8888

# Conexión a tu base de datos passages_db (Parametrizada)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/passages_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Clave secreta compartida (Debe ser idéntica en auth-service y booking-service)
app.jwt.secret=${JWT_SECRET:tu-clave-secreta-super-compartida-y-segura-de-al-menos-32-caracteres}