server:
  port: 8594

spring:
  application:
    name: gateway-service
  cloud:
    config:
      enabled: false
    gateway:
      routes:

        - id: auth-service-route
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**


        - id: booking-service-route
          uri: http://localhost:2051
          predicates:
            - Path=/api/v1/reservations/**