version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: time-booking-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: auth_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Script opcional para crear la segunda base de datos al arrancar
      - ./init-multiple-databases.sql:/docker-entrypoint-initdb.d/init-multiple-databases.sql

volumes:
  mysql_data: