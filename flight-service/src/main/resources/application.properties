server.port=8595
spring.application.name=flight-service

# Configuración de conexión a MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/time_flight_db

# Deshabilitar Config Client para ejecución local autónoma
spring.cloud.config.enabled=false

# EXCLUSIÓN CRUCIAL: Desactiva por completo cualquier intento de buscar JPA o JDBC relacional
spring.autoconfigure.exclude[0]=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
spring.autoconfigure.exclude[1]=org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration